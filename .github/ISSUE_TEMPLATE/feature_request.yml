name: Feature request
description: Suggest an idea, enhancement, or new hardware workflow for Strop.
body:
  - type: markdown
    attributes:
      value: |
        Please review [docs/SUPPORT.md](https://github.com/dedmo399/strop/blob/main/docs/SUPPORT.md) and [ROADMAP.md](https://github.com/dedmo399/strop/blob/main/ROADMAP.md) before submitting to check active development priorities and supported device scopes.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is (e.g., "I'm always frustrated when...").
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution or Feature
      description: Describe what you would like Strop to do and how you imagine it working.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Target Device & Environment
      description: List target Razer devices, Linux distribution, session (Wayland/X11), or related software (input-remapper, OpenRazer).
    validations:
      required: false
