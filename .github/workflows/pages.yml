name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'assets/**'
      - 'docs/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage site assets
        run: |
          mkdir -p site/assets/icons site/assets/screenshots
          cp assets/strop_icon.png site/assets/strop_icon.png
          cp assets/icons/*.png site/assets/icons/
          cp docs/screenshots/strop-suite.png site/assets/screenshots/strop-suite.png
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
