name: CI

on:
  push:
  pull_request:

jobs:
  tests-and-package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils dpkg-dev gir1.2-gtk-4.0 python3-evdev python3-gi python3-pytest
      - name: Validate sources and desktop entry
        run: |
          python3 -m py_compile strop.py strop_hud.py strop_keyboard.py strop_keypad.py strop_macro.py strop_mouse.py strop_studio.py strop_core/*.py
          desktop-file-validate strop.desktop
      - name: Run core tests
        env:
          PYTHONPATH: .
        run: python3 -m pytest -q tests/test_core.py
      - name: Build and inspect Debian package
        run: |
          ./build_deb.sh
          dpkg-deb --info strop_0.9.2_all.deb
          dpkg-deb --contents strop_0.9.2_all.deb | grep -F 'usr/share/applications/com.razer.strop.desktop'
          dpkg-deb --contents strop_0.9.2_all.deb | grep -F 'usr/bin/strop-keypad'
          dpkg-deb --contents strop_0.9.2_all.deb | grep -F 'usr/share/doc/strop/CHANGELOG.md'
